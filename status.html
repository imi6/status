<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading...</title>
<link id="favicon" rel="icon" type="image/png" href="" />
<style>
:root{
  --bg:#f4f6fb;
  --panel:#fff;
  --panel-2:#f7f9fc;
  --border:#dde3ee;
  --border-soft:#e8ecf4;
  --text:#1a2233;
  --dim:#5c6880;
  --faint:#8a95ab;
  --accent:#6366f1;
  --accent-2:#8b5cf6;
  --ok:#15803d;
  --ok-soft:rgba(21,128,61,.12);
  --down:#dc2626;
  --down-soft:rgba(220,38,38,.1);
  --warn:#d97706;
  --warn-soft:rgba(217,119,6,.12);
  --unknown:#c2cbdb;
  --radius:14px;
  --shadow:0 8px 30px rgba(23,43,77,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SFMono-Regular","JetBrains Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55}
body{
  min-height:100vh;
  background:
    radial-gradient(1100px 500px at 15% -10%,rgba(99,102,241,.12),transparent 60%),
    radial-gradient(900px 450px at 100% 0,rgba(139,92,246,.1),transparent 55%),
    var(--bg);
}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 48px}
.site-header{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.site-header .inner{height:62px;padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-photo{width:30px;height:30px;border-radius:9px;overflow:hidden;flex:none}
.logo-photo img{width:100%;height:100%;object-fit:cover}
.brand-name{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;white-space:nowrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.16)}
.header-actions{display:flex;align-items:center;gap:10px}
.segmented{display:inline-flex;padding:3px;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.segmented button{border:0;background:transparent;color:var(--dim);padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit;font-weight:600}
.segmented button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}

.panel{
  margin-top:26px;padding:26px;border-radius:var(--radius);border:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel),#eef1f7);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.panel::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 200px at 100% 0,rgba(99,102,241,.1),transparent 60%);
}
.headline{display:flex;align-items:center;gap:14px;position:relative}
.big-dot{width:15px;height:15px;border-radius:50%;flex:none;background:var(--unknown);position:relative}
.big-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:currentColor;opacity:.25;animation:pulse 2s infinite}
.big-dot.up{background:var(--ok);color:var(--ok)}
.big-dot.down{background:var(--down);color:var(--down)}
.big-dot.degraded{background:var(--warn);color:var(--warn)}
.big-dot.unknown{background:var(--unknown);color:var(--unknown)}
@keyframes pulse{0%{transform:scale(.8);opacity:.45}70%{transform:scale(1.6);opacity:0}100%{opacity:0}}
.headline h1{font-size:21px;font-weight:650}
.headline .sub{color:var(--dim);margin-top:2px;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;position:relative}
.metric{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:14px 16px}
.metric .label{color:var(--faint);font-size:12px;font-weight:600;letter-spacing:.4px}
.metric .value{font-size:24px;font-weight:680;margin-top:6px;font-variant-numeric:tabular-nums}

.group-switch{
  margin-top:16px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--panel);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;overflow-x:auto;
}
.switch-btn{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-weight:650;font-size:13px;
}
.switch-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.switch-icon{width:16px;height:16px;flex:none;display:block}
.switch-dot{width:8px;height:8px;border-radius:50%;background:var(--unknown);flex:none}
.switch-dot.up{background:#16a34a}
.switch-dot.down{background:#dc2626}
.switch-dot.degraded{background:#d97706}
.switch-btn.active .switch-dot{box-shadow:0 0 0 2px rgba(255,255,255,.45)}

.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.card{
  display:flex;flex-direction:column;min-width:0;
  border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(180deg,var(--panel),#eef1f7);
  box-shadow:var(--shadow);
}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px}
.card-title{min-width:0;flex:1}
.card-title strong{display:block;font-size:15.5px;font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title span{display:block;margin-top:2px;color:var(--faint);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{text-align:right;font-variant-numeric:tabular-nums}
.stat .k{display:block;font-size:11px;color:var(--faint);letter-spacing:.3px}
.stat .v{font-weight:650}
.badge{font-size:12px;font-weight:650;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.badge.up{color:var(--ok);background:var(--ok-soft);border-color:rgba(21,128,61,.28)}
.badge.down{color:var(--down);background:var(--down-soft);border-color:rgba(220,38,38,.28)}
.badge.degraded{color:var(--warn);background:var(--warn-soft);border-color:rgba(217,119,6,.28)}
.badge.unknown{color:var(--dim);background:#eef1f7;border-color:var(--border)}
.refresh-btn{
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;
}
.refresh-btn:hover:not(:disabled){border-color:var(--accent)}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed}
.card-body{margin-top:auto;padding:0 14px 14px}
.track{display:flex;align-items:stretch;gap:2px;height:34px}
.seg{position:relative;flex:1 1 0;min-width:2px;height:100%;border-radius:3px;background:var(--unknown);cursor:pointer}
.seg::after{content:"";position:absolute;left:-1px;right:-1px;top:-8px;bottom:-8px}
.seg.up,.seg.u-100{background:linear-gradient(180deg,#34e373,#16a34a)}
.seg.u-99{background:linear-gradient(180deg,#6ee787,#22c55e)}
.seg.u-90{background:linear-gradient(180deg,#a6e635,#65a30d)}
.seg.u-75{background:linear-gradient(180deg,#ffd43b,#eab308)}
.seg.u-50{background:linear-gradient(180deg,#ffc14d,#f59e0b)}
.seg.u-25{background:linear-gradient(180deg,#ff9f45,#ea580c)}
.seg.u-0,.seg.down{background:linear-gradient(180deg,#f87171,#b91c1c)}
.seg.degraded{background:linear-gradient(180deg,#ffd43b,#eab308)}
.seg.unknown,.seg.u-none{background:var(--unknown);opacity:.5}
.seg:hover{filter:brightness(1.08);transform:scaleY(1.08)}
.card-head{cursor:pointer}
.chev{color:var(--faint);font-size:12px;transition:transform .2s}
.card.open .chev{transform:rotate(90deg)}
.card-detail{display:none;padding:0 14px 14px;color:var(--dim);font-size:13px}
.card.open .card-detail{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-grid div{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px}
.detail-grid span{display:block;color:var(--faint);font-size:11px}
.detail-grid b{font-weight:650;font-variant-numeric:tabular-nums}
.time-row{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:6px}
.seg-tip{
  position:fixed;z-index:100;pointer-events:none;background:#fff;color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12px;
  box-shadow:0 6px 24px rgba(23,43,77,.14);max-width:280px;
}
.seg-tip b{display:block;margin-bottom:4px}
.empty{grid-column:1 / -1;padding:48px 20px;text-align:center;color:var(--faint);border:1px dashed var(--border);border-radius:var(--radius);background:var(--panel)}
.footer{margin-top:28px;text-align:center;color:var(--faint);font-size:12.5px}
.footer a{color:var(--dim)}
@media(max-width:1100px){
  .groups{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:800px){
  .groups{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .card-head{flex-wrap:wrap}
  .stat{text-align:left}
  .site-header .inner{height:auto;padding:12px 20px;flex-wrap:wrap}
  .header-actions{width:100%;justify-content:space-between}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap inner">
    <div class="brand">
      <div id="logoWrap" class="logo-photo" hidden><img id="logoImg" alt=""></div>
      <div>
        <div class="brand-name" id="pageTitle">分组健康监控</div>
        <div class="brand-sub" id="pageSubtitle"></div>
      </div>
    </div>
    <div class="header-actions">
      <div class="live"><span class="live-dot"></span><span>20 秒自动刷新</span></div>
      <div class="segmented" id="granPicker">
        <button type="button" data-gran="hour" class="active">按小时</button>
        <button type="button" data-gran="day">按天</button>
        <button type="button" data-gran="week">按周</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="headline">
      <span id="summaryDot" class="big-dot unknown"></span>
      <div>
        <h1 id="summary">正在读取状态</h1>
        <div class="sub" id="ovSub">正在读取</div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="label">展示分组</div><div class="value" id="mGroups">--</div></div>
      <div class="metric"><div class="label">当前成功率</div><div class="value" id="score">--</div></div>
      <div class="metric"><div class="label">平均探测延迟</div><div class="value" id="mLatency">--</div></div>
      <div class="metric"><div class="label">窗口采样</div><div class="value" id="mSamples">--</div></div>
    </div>
  </section>

  <section class="group-switch" id="groupSwitch" hidden></section>
  <section class="groups" id="app"><div class="empty">正在读取状态...</div></section>
  <div class="footer" id="pageFooter"></div>
</main>
<div id="segTip" class="seg-tip" hidden></div>

<script>
function fmtTime(v){if(!v)return'--';const d=new Date(v);if(Number.isNaN(d.getTime()))return'--';return d.toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function fmtTimeFull(v){const d=new Date(v);if(Number.isNaN(d.getTime()))return'--';return d.toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function statusLabel(s){return {up:'正常',down:'异常',degraded:'部分异常',unknown:'无采样'}[s]||'无采样';}
function elapsed(v){if(!v)return'';const ms=Date.now()-new Date(v).getTime();if(!Number.isFinite(ms)||ms<0)return'';const min=Math.floor(ms/60000);if(min<1)return'刚刚';if(min<60)return min+' 分钟前';return Math.floor(min/60)+' 小时前'}
function escapeHtml(t){return String(t).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function pct(v){return Number.isFinite(Number(v))?Number(v).toFixed(1)+'%':'--'}
function scoreValue(g){return Number.isFinite(Number(g.health_score))?Number(g.health_score):Number(g.uptime||0)}

const GRAN_LABEL={hour:'近 24 小时',day:'近 30 天',week:'近 12 周'};
let _gran=localStorage.getItem('statusGran')||'hour';
if(!GRAN_LABEL[_gran])_gran='day';
let _lastData=null;
let _openGroups=new Set();
try{_openGroups=new Set(JSON.parse(localStorage.getItem('statusOpen')||'[]'));}catch(e){_openGroups=new Set();}
function saveOpen(){localStorage.setItem('statusOpen',JSON.stringify([..._openGroups]));}

function fmtClock(v){const d=new Date(v);return d.toLocaleString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'})}
function fmtDay(v){const d=new Date(v);return d.toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit'})}
function fmtAxis(v){return _gran==='hour'?fmtClock(v):fmtDay(v)}
function barClass(b){
  if(!b||!b.samples)return 'u-none';
  const up=Number(b.success_rate);
  if(up>=97)return 'u-100';
  if(up>=90)return 'u-99';
  if(up>=80)return 'u-90';
  if(up>=70)return 'u-75';
  if(up>=60)return 'u-50';
  if(up>=40)return 'u-25';
  return 'u-0';
}
function windowStats(buckets){
  let samples=0,up=0,lat=0;
  for(const b of buckets||[]){
    const n=Number(b.samples)||0;
    samples+=n;
    up+=Number(b.up)||0;
    lat+=(Number(b.avg_latency_ms)||0)*n;
  }
  return {samples,up,rate:samples?up/samples*100:null,latency:samples?lat/samples:0};
}
function timelineHtml(buckets){
  return (buckets||[]).map(b=>{
    return '<span class="seg '+barClass(b)+'" data-start="'+(b.start||0)+'" data-end="'+(b.end||0)+'" data-samples="'+(b.samples||0)+'" data-up="'+(b.up||0)+'" data-rate="'+(Number(b.success_rate)||0)+'" data-l="'+(b.avg_latency_ms||0)+'"></span>';
  }).join('');
}
function segTipText(el){
  const samples=Number(el.dataset.samples)||0;
  const start=Number(el.dataset.start)||0;
  const end=Number(el.dataset.end)||0;
  if(!samples||!start)return '<b>无采集数据</b><div>这个时段还没有检测记录</div>';
  const up=Number(el.dataset.up)||0;
  const rate=Number(el.dataset.rate)||0;
  const lat=Number(el.dataset.l)||0;
  const delay=lat?(lat/1000).toFixed(2)+'s':'无延迟';
  return '<b>'+fmtTimeFull(start*1000)+' – '+fmtTimeFull(end*1000)+'</b><div>成功率 '+rate.toFixed(1)+'%</div><div>采样 '+up+'/'+samples+'</div><div>平均延迟 '+delay+'</div>';
}
let _group=localStorage.getItem('statusGroup')||'';
function sectionStatus(sec){
  const rows=sec.rows||[];
  if(!rows.length)return 'unknown';
  if(rows.some(r=>r.status==='down'))return 'down';
  if(rows.some(r=>r.status==='degraded'))return 'degraded';
  if(rows.every(r=>r.status==='up'))return 'up';
  return 'unknown';
}
function visibleSections(sections){
  if(!_group)return sections||[];
  return (sections||[]).filter(sec=>sec.name===_group);
}
function platformIcon(name){
  const n=String(name||'').toLowerCase();
  if(!n)return '';
  const mark=(bg,inner)=>'<svg class="switch-icon" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="'+bg+'"/>'+inner+'</svg>';
  const bare=(inner)=>'<svg class="switch-icon" viewBox="0 0 16 16" aria-hidden="true">'+inner+'</svg>';
  const icons=[
    {keys:['chatgpt','openai','gpt'],svg:mark('#111','<path fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" d="M8 2.8 11.2 4.6v3.6L8 10.1 4.8 8.2V4.6zM8 6.1l3.2 1.9v3.6L8 13.4 4.8 11.6V8z"/>')},
    {keys:['claude','anthropic'],svg:mark('#d97757','<path stroke="#fff" stroke-width="1.3" stroke-linecap="round" d="M8 3v10M4.4 4.4l7.2 7.2M3 8h10M4.4 11.6l7.2-7.2"/>')},
    {keys:['gemini','bard','双子座','google'],svg:bare('<path fill="#4c6fff" d="M8 1.1 9.5 6.5 14.9 8 9.5 9.5 8 14.9 6.5 9.5 1.1 8 6.5 6.5z"/><path fill="#8b5cf6" d="M12.3 1.2 12.9 3.1 14.8 3.7 12.9 4.3 12.3 6.2 11.7 4.3 9.8 3.7 11.7 3.1z"/>')},
    {keys:['deepseek','深度求索'],svg:mark('#4d6bfe','<path fill="#fff" d="M3.6 4.2h5.1a3.7 3.7 0 0 1 0 7.4H5.4V13H3.6zm1.8 1.6v4.2h3.2a2.1 2.1 0 0 0 0-4.2z"/>')},
    {keys:['grok','xai'],svg:mark('#111','<path fill="#fff" d="M4 4.2h2.1l1.9 2.8 1.9-2.8H12L9.3 8 12 11.8H9.9L8 9 6.1 11.8H4L6.7 8z"/>')},
    {keys:['qwen','tongyi','通义','千问','阿里'],svg:mark('#615ced','<circle cx="8" cy="8" r="3.3" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="8" cy="8" r="1.1" fill="#fff"/>')},
    {keys:['kimi','moonshot','月之暗面'],svg:mark('#111','<path fill="#fff" d="M9.2 3.1a4.6 4.6 0 1 0 0 9.8 3.7 3.7 0 0 1 0-9.8z"/>')},
    {keys:['chatglm','zhipu','glm','智谱'],svg:mark('#1d4ed8','<path fill="#fff" d="M4 4h8v1.7H4zm0 3.2h6.2v1.7H4zm0 3.1h4.4V12H4z"/>')},
    {keys:['doubao','豆包'],svg:mark('#3b82f6','<circle cx="6.4" cy="8" r="2.5" fill="#fff"/><circle cx="9.8" cy="8" r="2.2" fill="#dbeafe"/>')},
    {keys:['ernie','wenxin','文心','一言'],svg:mark('#245bdb','<path fill="#fff" d="M8 3.2 12.2 8 8 12.8 3.8 8z"/>')},
    {keys:['iflytek','spark','讯飞','星火'],svg:mark('#f97316','<path fill="#fff" d="M8.6 2.6c.2 2.2-.4 3.4-1.6 4.4 1.8.2 3.2 1.4 3.6 3.2.6-1 .6-2 .2-2.8 1.6.8 2.4 2.2 2.2 4-0.4 2.6-2.6 4.2-5.2 4-2.8-.2-4.6-2-4.6-4.6 0-2.6 1.4-4.4 3.2-6.2.4 1.2 1.2 1.8 2.2 2z"/>')},
    {keys:['hunyuan','混元'],svg:mark('#0f766e','<circle cx="8" cy="8" r="3.4" fill="none" stroke="#fff" stroke-width="1.4"/><circle cx="8" cy="8" r="1.2" fill="#fff"/>')},
    {keys:['minimax','hailuo','海螺'],svg:mark('#111','<path fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M3.4 11.6 5.4 4.4 8 10.2 10.6 4.4 12.6 11.6"/>')},
    {keys:['llama','meta'],svg:mark('#0668e1','<path fill="#fff" d="M3.4 12.2 8 3.6l4.6 8.6H3.4z"/>')},
    {keys:['mistral'],svg:mark('#ff7000','<path fill="#fff" d="M3.2 4.2h2.3v2.2H3.2zm3.6 0h2.4v2.2H6.8zm3.7 0h2.3v2.2h-2.3zM5 7.2h2.3v2.2H5zm3.6 0h2.4v2.2H8.6zM6.8 10.2h2.4V12.4H6.8z"/>')},
    {keys:['perplexity'],svg:mark('#20808d','<circle cx="8" cy="8" r="2.1" fill="#fff"/><path fill="none" stroke="#fff" stroke-width="1.2" d="M8 3.2v1.6M8 11.2v1.6M3.2 8h1.6M11.2 8h1.6"/>')}
  ];
  for(const item of icons){
    for(const key of item.keys){
      if(n.indexOf(key)>=0)return item.svg;
    }
  }
  return '';
}
function renderGroupSwitch(sections){
  const el=document.getElementById('groupSwitch');
  const names=(sections||[]).map(sec=>sec.name).filter(Boolean);
  if(_group&&names.indexOf(_group)<0)_group='';
  if(!names.length){el.hidden=true;el.innerHTML='';return;}
  const btn=(name,label,status)=>{
    const active=(_group||'')===name?' active':'';
    const icon=platformIcon(label);
    const dot=status?'<span class="switch-dot '+status+'"></span>':'';
    return '<button type="button" class="switch-btn'+active+'" data-group="'+escapeHtml(name)+'">'+icon+dot+escapeHtml(label)+'</button>';
  };
  let html=btn('','全部','');
  for(const sec of sections)html+=btn(sec.name,sec.name,sectionStatus(sec));
  el.hidden=false;
  el.innerHTML=html;
}
function summarize(sections){
  const rows=[];
  for(const sec of sections||[])for(const r of sec.rows||[])rows.push(r);
  let samples=0,up=0,lat=0;
  for(const g of rows){
    const st=windowStats((g.timelines||{})[_gran]);
    samples+=st.samples;
    up+=st.up;
    lat+=st.latency*st.samples;
  }
  return {
    count:rows.length,
    score:samples?(up/samples*100).toFixed(1)+'%':'--',
    latency:samples?(lat/samples/1000).toFixed(2)+'s':'--',
    samples
  };
}

let _frontendTitle='分组健康监控';
let _manualRefreshGroups=new Set();
let _manualRefreshCooldown=60;
let _manualRefreshRemaining=0;
let _cooldownTimer=null;
function render(data){
  _lastData=data;
  document.title=data.title||_frontendTitle;
  const sections=Array.isArray(data.sections)?data.sections:[];
  renderGroupSwitch(sections);
  const shown=visibleSections(sections);
  const overall=data.overall||{status:'unknown',label:'采样中'};
  const summary=summarize(shown);
  const dot=document.getElementById('summaryDot');
  dot.className='big-dot '+(overall.status||'unknown');
  document.getElementById('summary').textContent=overall.label+(data.checking?' · 检测中':'');
  const scope=_group?_group+' · ':'';
  document.getElementById('ovSub').textContent=scope+summary.count+' 个分组 · '+GRAN_LABEL[_gran]+'统计'+(data.last_completed_at?' · 最近检测 '+elapsed(data.last_completed_at):'');
  document.getElementById('score').textContent=summary.score;
  document.getElementById('mGroups').textContent=String(summary.count);
  document.getElementById('mLatency').textContent=summary.latency;
  document.getElementById('mSamples').textContent=String(summary.samples);

  const serverRemaining=data.manual_refresh_remaining||0;
  if(serverRemaining>_manualRefreshRemaining){
    _manualRefreshRemaining=serverRemaining;
    if(_manualRefreshRemaining>0&&!_cooldownTimer){startCooldown();}
  }
  updateRefreshButtons();

  if(!shown.length){document.getElementById('app').innerHTML='<div class="empty">'+(_group?'这个分组暂无检测项':'暂无可展示分组')+'</div>';return;}

  let output='';
  for(const sec of shown){
    const rows=sec.rows||[];
    if(!rows.length)continue;
    const canRefresh=_manualRefreshGroups.has(sec.name);
    const refreshBtn=canRefresh?'<button class="refresh-btn" onclick="manualRefresh(this)">刷新</button>':'';
    for(const g of rows){
      const status=g.status||'unknown';
      const buckets=(g.timelines||{})[_gran]||[];
      const win=windowStats(buckets);
      const latency=g.latency_ms?(g.latency_ms/1000).toFixed(2)+'s':'无延迟样本';
      const groupName=sec.name||g.sub_name||'';
      const sub=g.sub_name&&g.sub_name!==groupName?g.sub_name+' · ':'';
      const rate=win.rate==null?'--':win.rate.toFixed(1)+'%';
      const winLat=win.samples?(win.latency/1000).toFixed(2)+'s':'--';
      const key=groupName+'|'+(g.sub_name||'')+'|'+(g.name||'');
      const opened=_openGroups.has(key)?' open':'';
      const axis=buckets.length?'<div class="time-row"><span>'+fmtAxis(buckets[0].start*1000)+'</span><span>'+fmtAxis(buckets[Math.floor(buckets.length/2)].start*1000)+'</span><span>'+fmtAxis(buckets[buckets.length-1].end*1000)+'</span></div>':'';
      output+='<article class="card'+opened+'" data-key="'+escapeHtml(key)+'"><div class="card-head"><span class="big-dot '+status+'"></span><div class="card-title"><strong title="'+escapeHtml(groupName)+'">'+escapeHtml(groupName)+'</strong><span>'+escapeHtml(sub)+(g.label||'采样中')+' · '+latency+'</span></div><div class="stat"><span class="k">成功率</span><span class="v">'+rate+'</span></div><span class="badge '+status+'">'+(g.label||'采样中')+'</span>'+refreshBtn+'<span class="chev">▶</span></div><div class="card-body"><div class="track">'+timelineHtml(buckets)+'</div>'+axis+'</div><div class="card-detail"><div class="detail-grid"><div><span>'+GRAN_LABEL[_gran]+'采样</span><b>'+win.samples+'</b></div><div><span>成功率</span><b>'+rate+'</b></div><div><span>平均延迟</span><b>'+winLat+'</b></div><div><span>最近检测</span><b>'+fmtTime(g.last_checked_at)+'</b></div></div></div></article>';
    }
  }
  document.getElementById('app').innerHTML=output;
}

async function load(){
  try{
    const res=await fetch('/api/status',{cache:'no-store'});
    render(await res.json());
  }catch(err){
    document.getElementById('summary').textContent='连接失败';
  }
}
async function initFrontend(){
  try{
    const res=await fetch('/api/config',{cache:'no-store'});
    const cfg=await res.json();
    const f=cfg.frontend||{};
    if(f.title){
      _frontendTitle=f.title;
      document.title=f.title;
      document.getElementById('pageTitle').textContent=f.title;
    }
    if(f.icon){
      document.getElementById('favicon').href=f.icon;
      document.getElementById('logoImg').src=f.icon;
      document.getElementById('logoWrap').hidden=false;
    }
    if(f.subtitle){
      document.getElementById('pageSubtitle').textContent=f.subtitle;
    }
    if(f.footer){
      document.getElementById('pageFooter').innerHTML=f.footer;
    }
    _manualRefreshCooldown=cfg.manualRefreshCooldown||60;
    if(Array.isArray(cfg.groups)){
      _manualRefreshGroups=new Set(cfg.groups.filter(g=>g.manualRefresh).map(g=>g.name));
    }
  }catch(e){}
}
async function start(){
  await initFrontend();
  load();
  setInterval(load,20000);
}

function manualRefresh(btn){
  if(_manualRefreshRemaining>0)return;
  btn.disabled=true;
  btn.textContent='...';
  fetch('/api/refresh',{method:'POST'}).then(r=>r.json()).then(data=>{
    if(data.error==='cooldown'&&data.remaining){
      _manualRefreshRemaining=data.remaining;
      startCooldown();
    }else if(data.error==='already checking'){
      btn.disabled=false;
      btn.textContent='刷新';
    }else if(data.ok){
      _manualRefreshRemaining=data.cooldown||_manualRefreshCooldown;
      startCooldown();
      load();
    }
  }).catch(()=>{
    btn.disabled=false;
    btn.textContent='刷新';
  });
}

function startCooldown(){
  if(_cooldownTimer)clearInterval(_cooldownTimer);
  updateRefreshButtons();
  _cooldownTimer=setInterval(()=>{
    _manualRefreshRemaining--;
    if(_manualRefreshRemaining<=0){
      _manualRefreshRemaining=0;
      clearInterval(_cooldownTimer);
      _cooldownTimer=null;
    }
    updateRefreshButtons();
  },1000);
}

function updateRefreshButtons(){
  document.querySelectorAll('.refresh-btn').forEach(btn=>{
    if(_manualRefreshRemaining>0){
      btn.disabled=true;
      btn.textContent=_manualRefreshRemaining+'s';
    }else{
      btn.disabled=false;
      btn.textContent='刷新';
    }
  });
}
document.getElementById('groupSwitch').addEventListener('click',ev=>{
  const btn=ev.target.closest('.switch-btn');
  if(!btn)return;
  _group=btn.dataset.group||'';
  localStorage.setItem('statusGroup',_group);
  if(_lastData)render(_lastData);
});
document.getElementById('granPicker').querySelectorAll('button').forEach(btn=>{
  btn.classList.toggle('active',btn.dataset.gran===_gran);
  btn.addEventListener('click',()=>{
    _gran=btn.dataset.gran;
    localStorage.setItem('statusGran',_gran);
    document.getElementById('granPicker').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));
    if(_lastData)render(_lastData);
  });
});
document.getElementById('app').addEventListener('click',ev=>{
  if(ev.target.closest('.refresh-btn'))return;
  const head=ev.target.closest('.card-head');
  if(!head)return;
  const card=head.parentElement;
  card.classList.toggle('open');
  const key=card.dataset.key||'';
  if(card.classList.contains('open'))_openGroups.add(key);else _openGroups.delete(key);
  saveOpen();
});
start();
const segTip=document.getElementById('segTip');
function moveSegTip(ev){
  const pad=14;
  segTip.hidden=false;
  let x=ev.clientX+pad;
  let y=ev.clientY+pad;
  const r=segTip.getBoundingClientRect();
  if(x+r.width>window.innerWidth-8)x=Math.max(8,ev.clientX-r.width-pad);
  if(y+r.height>window.innerHeight-8)y=Math.max(8,ev.clientY-r.height-pad);
  segTip.style.left=x+'px';
  segTip.style.top=y+'px';
}
document.addEventListener('mouseover',ev=>{
  const el=ev.target.closest&&ev.target.closest('.seg');
  if(!el)return;
  segTip.innerHTML=segTipText(el);
  moveSegTip(ev);
});
document.addEventListener('mousemove',ev=>{
  if(segTip.hidden)return;
  const el=ev.target.closest&&ev.target.closest('.seg');
  if(!el){segTip.hidden=true;return;}
  moveSegTip(ev);
});
document.addEventListener('mouseout',ev=>{
  const el=ev.target.closest&&ev.target.closest('.seg');
  if(!el)return;
  const next=ev.relatedTarget&&ev.relatedTarget.closest&&ev.relatedTarget.closest('.seg');
  if(next)return;
  segTip.hidden=true;
});
</script>
